<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="795" viewBox="0 0 1080 795" role="img" aria-label="CoursePilot 监控与评测">
<rect width="1080" height="100%" fill="#f7f9fc"/>
<style>text {font-family: Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#172b4d} .title{font-size:28px;font-weight:bold}.label{font-size:22px;font-weight:bold}.body{font-size:20px}</style>
<text x="50" y="55" class="title">CoursePilot 监控与评测</text>
<rect x="50" y="90" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="130" class="label">执行统计</text>
<text x="350" y="130" class="body">Agent 工具成功率 延迟 连续失败</text>
<text x="350" y="162" class="body">知识工具缓存与熔断状态</text>
<path d="M540 201 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="225" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="265" class="label">监控反馈</text>
<text x="350" y="265" class="body">PerformanceMonitor → Prometheus 与告警</text>
<text x="350" y="297" class="body">monitor_penalty → 同类型实例评分</text>
<path d="M540 336 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="360" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="400" class="label">评测分工</text>
<text x="350" y="400" class="body">准确率 Macro-F1 与 LLM Judge</text>
<text x="350" y="432" class="body">真实模型回归用程序检查业务状态</text>
<path d="M540 471 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="495" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="535" class="label">已保存结果</text>
<text x="350" y="535" class="body">full 人工 30 场景 29 个通过</text>
<text x="350" y="567" class="body">修复失败项单独复测 3/3</text>
<path d="M540 606 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="630" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="670" class="label">解释边界</text>
<text x="350" y="670" class="body">不是线上成功率或 Judge 得分</text>
<text x="350" y="702" class="body">未覆盖生产负载 真实审批支付与浏览器</text>
