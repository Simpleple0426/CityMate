<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="795" viewBox="0 0 1080 795" role="img" aria-label="CoursePilot 角色 Skills 与工具权限">
<rect width="1080" height="100%" fill="#f7f9fc"/>
<style>text {font-family: Microsoft YaHei, Noto Sans CJK SC, sans-serif;fill:#172b4d} .title{font-size:28px;font-weight:bold}.label{font-size:22px;font-weight:bold}.body{font-size:20px}</style>
<text x="50" y="55" class="title">CoursePilot 角色 Skills 与工具权限</text>
<rect x="50" y="90" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="130" class="label">角色池</text>
<text x="350" y="130" class="body">课程咨询 选课规划 教务办理 费用与权益</text>
<text x="350" y="162" class="body">另有人工交接出口</text>
<path d="M540 201 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="225" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="265" class="label">共享执行</text>
<text x="350" y="265" class="body">AgentProfile 角色契约 BaseAgent 工具循环</text>
<text x="350" y="297" class="body">主辅协作按依赖顺序执行</text>
<path d="M540 336 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="360" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="400" class="label">Skills</text>
<text x="350" y="400" class="body">角色与关键词匹配 按需参考资料</text>
<text x="350" y="432" class="body">显式 reload 不授予工具权限</text>
<path d="M540 471 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="495" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="535" class="label">实际工具权限</text>
<text x="350" y="535" class="body">get_tools 白名单 + 参数校验</text>
<text x="350" y="567" class="body">所有业务角色共享 search_knowledge_base</text>
<path d="M540 606 v15 m-5 -5 l5 5 5 -5" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="50" y="630" width="980" height="108" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="75" y="670" class="label">确认边界</text>
<text x="350" y="670" class="body">模型可调用 prepare_transfer 生成草稿</text>
<text x="350" y="702" class="body">submit 仅由完整用户确认处理器执行</text>
</svg>